{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}E-Vidence — User Portal{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/user_home/">
            <span class="brand-icon"><i class="fa fa-shield-halved"></i></span>
            E-VIDENCE
            <span class="navbar-badge ms-2" style="background:rgba(0,212,255,0.15);color:#00d4ff;border:1px solid rgba(0,212,255,0.4);">USER</span>
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#nb">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nb">
            <ul class="navbar-nav ms-auto align-items-center gap-1">
                <li class="nav-item"><a class="nav-link {% block nav_home %}{% endblock %}" href="/user_home/"><i class="fa fa-gauge me-1"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link {% block nav_upload %}{% endblock %}" href="/upload_evidence/"><i class="fa fa-upload me-1"></i>Upload</a></li>
                <li class="nav-item"><a class="nav-link {% block nav_evidence %}{% endblock %}" href="/my_evidence/"><i class="fa fa-folder-open me-1"></i>My Evidence</a></li>
                <li class="nav-item"><a class="nav-link {% block nav_profile %}{% endblock %}" href="/user_profile/"><i class="fa fa-user me-1"></i>Profile</a></li>
                <li class="nav-item ms-2">
                    <div class="d-flex align-items-center gap-2">
                        <span style="font-size:0.8rem;color:#8ba5c0;">{{ request.session.username }}</span>
                        <a href="/logout/" class="btn-logout nav-link"><i class="fa fa-right-from-bracket me-1"></i>Logout</a>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ALERTS -->
<div class="container-fluid px-4 mt-3">
{% if messages %}{% for msg in messages %}
<div class="alert {% if msg.tags == 'error' %}alert-cyber-error{% else %}alert-cyber{% endif %} alert-dismissible fade show" role="alert">
    <i class="fa {% if msg.tags == 'error' %}fa-triangle-exclamation{% else %}fa-circle-check{% endif %} me-2"></i>{{ msg }}
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
</div>
{% endfor %}{% endif %}
</div>

<div class="container-fluid px-4 py-3 mb-4">{% block content %}{% endblock %}</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
