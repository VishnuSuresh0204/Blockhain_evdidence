{% extends 'base.html' %}

{% block title %}User Dashboard - My App{% endblock %}

{% block content %}
<div class="row mt-5">
    <div class="col-12">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title text-white">User Dashboard</h2>
                <hr class="border-light">
                <p class="card-text text-light fs-5">Welcome back, {{ request.session.username }}!</p>
                <div class="row mt-4">
                    <div class="col-md-4 mb-4">
                        <div class="card bg-primary text-white h-100 border-0">
                            <div class="card-body py-5 text-center">
                                <h3 class="mb-0">Profile Info</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-4">
                        <div class="card bg-success text-white h-100 border-0">
                            <div class="card-body py-5 text-center">
                                <h3 class="mb-0">My Activity</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-4">
                        <div class="card bg-info text-white h-100 border-0">
                            <div class="card-body py-5 text-center">
                                <h3 class="mb-0">Settings</h3>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
