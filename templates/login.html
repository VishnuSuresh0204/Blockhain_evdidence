{% extends 'base.html' %}

{% block title %}Login - My App{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-lg">
            <div class="card-header text-center">
                <h3 class="font-weight-light my-4">Login</h3>
            </div>
            <div class="card-body p-5">
                <form method="POST" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="form-floating mb-3">
                        <input class="form-control" id="inputUsername" type="text" name="username" placeholder="Enter username" required />
                        <label for="inputUsername" class="text-secondary">Username</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input class="form-control" id="inputPassword" type="password" name="password" placeholder="Password" required />
                        <label for="inputPassword" class="text-secondary">Password</label>
                    </div>
                    <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                        <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center py-3">
                <div class="small"><a href="/registration" class="text-light">Need an account? Sign up!</a></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
